{% extends 'base.html' %}

{% block content %}
<div class="layui-row layui-col-space15">
    <!-- 搜索区域 -->
    <div class="layui-col-md12">
        <div class="layui-card">
            <div class="layui-card-header">数据采集任务</div>
            <div class="layui-card-body">
                <form class="layui-form" action="" onsubmit="return false;">
                    <div class="layui-form-item">
                        <div class="layui-input-group" style="width: 100%;">
                            <div class="layui-input-prefix">
                                <i class="layui-icon layui-icon-search"></i>
                            </div>
                            <input type="text" id="keywordInput" name="keyword" placeholder="请输入采集关键词或需求..." class="layui-input" autocomplete="off">
                            <div class="layui-input-split layui-input-suffix" style="cursor: pointer; background-color: #1e9fff; color: #fff;" id="btnStartCollect">
                                开始采集
                            </div>
                        </div>
                    </div>
                </form>
                
                <!-- 进度提示 -->
                <div id="progressArea" style="display: none; margin-top: 15px;">
                    <div class="layui-progress layui-progress-big" lay-showpercent="true" lay-filter="collectProgress">
                        <div class="layui-progress-bar layui-bg-blue" lay-percent="0%"></div>
                    </div>
                    <p id="progressText" style="margin-top: 5px; color: #666; font-size: 12px;">正在初始化采集任务...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 结果展示区域 -->
    <div class="layui-col-md12">
        <div class="layui-card">
            <div class="layui-card-header">
                采集结果 
                <span class="layui-badge layui-bg-blue" id="resultCountBadge" style="display:none;">0</span>
                
                <div class="layui-layout-right" style="padding-right: 15px;">
                    <button class="layui-btn layui-btn-sm layui-btn-normal" id="btnSaveSelected">
                        <i class="layui-icon layui-icon-list"></i> 保存选中数据
                    </button>
                </div>
            </div>
            <div class="layui-card-body">
                <div id="emptyState" style="text-align: center; padding: 50px; color: #ccc;">
                    <i class="layui-icon layui-icon-console" style="font-size: 48px; display: block; margin-bottom: 10px;"></i>
                    <p>请输入关键词开始采集数据</p>
                </div>
                
                <div id="dataList" class="layui-row layui-col-space15" style="display: none;">
                    <!-- 数据项模板 -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 模板：数据卡片 -->
<script type="text/html" id="itemTemplate">
    <div class="layui-col-md12 data-item" data-id="{{d.id}}">
        <div class="layui-card" style="border: 1px solid #eee; box-shadow: none;">
            <div class="layui-card-body" style="position: relative; padding-left: 40px;">
                <!-- 选择框 -->
                <div style="position: absolute; left: 10px; top: 15px;">
                    <input type="checkbox" class="item-checkbox" lay-skin="primary" data-index="{{d.index}}">
                </div>
                
                <div class="layui-row layui-col-space15">
                    {{# if(d.cover){ }}
                    <div class="layui-col-xs3 layui-col-sm2">
                        <img src="{{d.cover}}" style="width: 100%; height: 80px; object-fit: cover; border-radius: 4px;">
                    </div>
                    {{# } }}
                    
                    <div class="{{d.cover ? 'layui-col-xs9 layui-col-sm10' : 'layui-col-xs12'}}">
                        <h3 style="font-size: 16px; margin-bottom: 8px;">
                            <a href="{{d.original_url}}" target="_blank" style="color: #333; font-weight: 500;">{{d.title}}</a>
                        </h3>
                        <div style="color: #999; font-size: 12px; margin-bottom: 8px;">
                            <span class="layui-badge layui-bg-gray">{{d.source}}</span>
                            <span style="margin-left: 10px;">{{d.publish_date || '刚刚'}}</span>
                        </div>
                        
                        <div style="margin-top: 10px;">
                            <button class="layui-btn layui-btn-xs layui-btn-primary btn-deep-collect" data-index="{{d.index}}" data-url="{{d.original_url}}">
                                <i class="layui-icon layui-icon-engine"></i> 深度采集
                            </button>
                            <span class="deep-status-tag" style="display: none; color: #52c41a; margin-left: 10px; font-size: 12px;">
                                <i class="layui-icon layui-icon-ok-circle"></i> 已深度采集
                            </span>
                        </div>
                    </div>
                </div>
                
                <!-- 深度采集内容预览 (默认隐藏) -->
                <div class="deep-content-preview" style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; font-size: 12px; color: #666; border-radius: 4px;">
                </div>
            </div>
        </div>
    </div>
</script>

{% endblock %}

{% block scripts %}
<script>
layui.use(['layer', 'form', 'jquery', 'laytpl', 'element'], function(){
    var layer = layui.layer;
    var $ = layui.jquery;
    var laytpl = layui.laytpl;
    var element = layui.element;
    
    // 存储当前采集的数据
    var currentDataList = [];
    
    // 开始采集
    $(document).on('click', '#btnStartCollect', function(){
        var keyword = $('#keywordInput').val();
        if(!keyword) {
            layer.msg('请输入关键词');
            return;
        }
        
        // 重置状态
        currentDataList = [];
        $('#dataList').empty().hide();
        $('#emptyState').hide();
        $('#progressArea').show();
        $('#resultCountBadge').hide();
        
        // 模拟进度条动画
        element.progress('collectProgress', '10%');
        $('#progressText').text('正在连接采集节点...');
        
        setTimeout(function(){
            element.progress('collectProgress', '40%');
            $('#progressText').text('正在抓取全网数据...');
            
            // 发起请求
            $.ajax({
                url: "{{ url_for('crawler.search_api') }}",
                type: 'GET',
                data: { keyword: keyword },
                success: function(res) {
                    element.progress('collectProgress', '100%');
                    $('#progressText').text('采集完成');
                    
                    setTimeout(function(){
                        $('#progressArea').hide();
                        element.progress('collectProgress', '0%');
                        
                        if(res.code === 0 && res.data.length > 0) {
                            currentDataList = res.data.map((item, index) => {
                                item.index = index; // 添加索引方便查找
                                item.keyword = keyword; // 记录来源关键词
                                return item;
                            });
                            renderList(currentDataList);
                        } else {
                            $('#emptyState').show().find('p').text('未找到相关数据');
                        }
                    }, 500);
                },
                error: function() {
                    layer.msg('采集失败，请重试');
                    $('#progressArea').hide();
                    $('#emptyState').show();
                }
            });
        }, 800);
    });
    
    // 渲染列表
    function renderList(data) {
        $('#dataList').empty();
        var getTpl = itemTemplate.innerHTML;
        
        data.forEach(function(item){
            laytpl(getTpl).render(item, function(html){
                $('#dataList').append(html);
            });
        });
        
        $('#dataList').show();
        $('#resultCountBadge').text(data.length).show();
    }
    
    // 深度采集按钮点击
    $(document).on('click', '.btn-deep-collect', function(){
        var btn = $(this);
        var index = btn.data('index');
        var url = btn.data('url');
        var itemData = currentDataList[index];
        
        if(itemData.is_deep_collected) {
            layer.msg('该条目已执行过深度采集');
            return;
        }
        
        btn.addClass('layui-btn-disabled').prop('disabled', true).html('<i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i> 采集...');
        
        $.ajax({
            url: "{{ url_for('crawler.deep_collect_api') }}",
            type: 'POST',
            data: { url: url },
            success: function(res) {
                if(res.code === 0) {
                    // 更新数据
                    itemData.content = res.data.content;
                    itemData.is_deep_collected = true;
                    
                    // 更新UI
                    btn.hide();
                    btn.siblings('.deep-status-tag').show();
                    
                    // 显示部分内容预览
                    var preview = itemData.content.substring(0, 100) + '...';
                    btn.closest('.layui-card-body').find('.deep-content-preview').text(preview).show();
                    
                    layer.msg('深度采集成功');
                } else {
                    layer.msg('深度采集失败: ' + res.msg);
                    btn.removeClass('layui-btn-disabled').prop('disabled', false).html('<i class="layui-icon layui-icon-engine"></i> 深度采集');
                }
            },
            error: function() {
                layer.msg('请求失败');
                btn.removeClass('layui-btn-disabled').prop('disabled', false).html('<i class="layui-icon layui-icon-engine"></i> 深度采集');
            }
        });
    });
    
    // 批量保存
    $(document).on('click', '#btnSaveSelected', function(){
        var selectedIndexes = [];
        $('.item-checkbox:checked').each(function(){
            selectedIndexes.push($(this).data('index'));
        });
        
        if(selectedIndexes.length === 0) {
            layer.msg('请至少选择一条数据');
            return;
        }
        
        var dataToSave = selectedIndexes.map(idx => currentDataList[idx]);
        
        var loadIndex = layer.load(2);
        $.ajax({
            url: "{{ url_for('crawler.save_api') }}",
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ data: dataToSave }),
            success: function(res) {
                layer.close(loadIndex);
                if(res.code === 0) {
                    layer.alert(res.msg, {icon: 1});
                } else {
                    layer.alert('保存失败: ' + res.msg, {icon: 2});
                }
            },
            error: function() {
                layer.close(loadIndex);
                layer.msg('网络请求失败');
            }
        });
    });
});
</script>
{% endblock %}
